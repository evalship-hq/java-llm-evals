name: Evals
on:
  pull_request:
  push:
    branches: [main]
jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -q package
      - run: ./mvnw -B -q exec:java -Dexec.mainClass=com.evalship.tinyeval.Main -Dexec.classpathScope=test -Dexec.args="-n 3"
        if: env.ANTHROPIC_API_KEY != ''
      - run: echo "::notice::Add the ANTHROPIC_API_KEY repository secret to run the evals."
        if: env.ANTHROPIC_API_KEY == ''
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval-results.json
